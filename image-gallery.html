<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Decor</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f1eb;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .home-image {
            width: 90%;
            max-width: 1200px;
            height: auto;
            display: block;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
    </style>
</head>

<body>

    <div class="container">
        <img 
            class="home-image"
            src="https://i.pinimg.com/736x/89/5b/ce/895bce044372abeee976f3aed77c4d54.jpg"
            alt="Modern Home Decor"
        >
    </div>

</body>
</html>
